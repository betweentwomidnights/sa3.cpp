# Dry-run packaging only. Published releases continue to use release.yml until
# Linux CUDA/runtime distribution and native x64/ARM64 hardware checks are ready.
name: Linux packaging dry run

on:
  pull_request:
    paths:
      - ci/package-linux.py
      - ci/check-runtime-package.py
      - tests/linux_package_test.py
      - .github/workflows/linux-packaging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake python3 binutils libvulkan-dev glslc spirv-headers

      - name: Build, test, package, and check extracted archives
        run: |
          python3 tests/linux_package_test.py
          version="v$(sed -nE 's/^project\(sa3_cpp VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          python3 ci/package-linux.py --version "$version" --require-clean --jobs 4 --backends vulkan
          (cd dist-linux && sha256sum -c SHA256SUMS-linux-x64)

      - name: Keep verified dry-run packages
        uses: actions/upload-artifact@v4
        with:
          name: sa3-linux-x64-vulkan-dry-run
          path: |
            dist-linux/*.zip
            dist-linux/SHA256SUMS-linux-x64
          retention-days: 7

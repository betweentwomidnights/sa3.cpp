# Dry-run packaging only; also callable by release.yml without a tag.
# Publication promotes verified artifacts through release.yml; this workflow builds only.
name: Linux packaging dry run

on:
  pull_request:
    paths:
      - ci/publish-linux-preview.py
      - tests/linux_preview_test.py
      - .github/workflows/release.yml
      - ci/package-linux.py
      - ci/check-runtime-package.py
      - tests/linux_package_test.py
      - .github/workflows/linux-packaging.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} Vulkan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake python3 binutils libvulkan-dev glslc spirv-headers
          if [ "$PLATFORM" = linux-arm64 ]; then
            sudo apt-get install -y gcc-14 g++-14
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          fi

      - name: Build, test, package, and check extracted archives
        run: |
          python3 tests/linux_preview_test.py
          python3 tests/linux_package_test.py
          version="v$(sed -nE 's/^project\(sa3_cpp VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          python3 ci/package-linux.py --version "$version" --require-clean --jobs 4 --backends vulkan
          (cd dist-linux && sha256sum -c "SHA256SUMS-$PLATFORM")

      - name: Keep verified dry-run packages
        uses: actions/upload-artifact@v4
        with:
          name: sa3-${{ matrix.platform }}-vulkan-dry-run
          path: |
            dist-linux/*.zip
            dist-linux/SHA256SUMS-*
          retention-days: 7
